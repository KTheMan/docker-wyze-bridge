name: Wyze SD Go fork validation

on:
  push:
    branches: [ci/wyze-sd-go-3584994]

permissions:
  contents: read

env:
  VALIDATION_SHA: 35849940f39bb8c9b9fc0c941e913ffd39f8a807

jobs:
  test:
    name: Go tests, race, vet and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.VALIDATION_SHA }}
          persist-credentials: false
      - name: Verify immutable PR source
        run: test "$(git rev-parse HEAD)" = "$VALIDATION_SHA"
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'
      - name: Run upstream Go checks
        run: |
          go test -v -cover ./...
          go vet ./...
      - name: Race checks and native build
        run: |
          CGO_ENABLED=1 go test -race ./...
          go build -o "$RUNNER_TEMP/wyze-bridge" ./cmd/wyze-bridge

  build:
    name: Docker build (no publishing)
    needs: [test]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DOCKER_BUILD_RECORD_UPLOAD: 'false'
      DOCKER_BUILD_SUMMARY: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.VALIDATION_SHA }}
          persist-credentials: false
      - name: Verify immutable PR source
        run: test "$(git rev-parse HEAD)" = "$VALIDATION_SHA"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build upstream Dockerfile for amd64 and arm64
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          load: false
          build-args: VERSION=sd-validation-3584994
          provenance: false
