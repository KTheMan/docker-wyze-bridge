name: SD download tests

on:
  pull_request:
    paths:
      - app/frontend.py
      - app/wyzebridge/sd_download.py
      - app/requirements.txt
      - tests/**
      - .github/workflows/sd-download-tests.yml
  push:
    paths:
      - app/frontend.py
      - app/wyzebridge/sd_download.py
      - app/requirements.txt
      - tests/**
      - .github/workflows/sd-download-tests.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install 'Flask==3.0.*' 'Flask-HTTPAuth==4.8.*'
      - name: Run offline SD adapter tests
        run: python -m unittest discover -s tests -v
      - name: Check Python syntax
        run: python -m py_compile app/frontend.py app/wyzebridge/sd_download.py
